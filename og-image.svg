<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Link preview card for TinyWelt3D. Converted to og-image.png by the deploy workflow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4acb7"/>
      <stop offset="0.5" stop-color="#ffe5d9"/>
      <stop offset="1" stop-color="#F6F0E7"/>
    </linearGradient>
    <filter id="cocoa" color-interpolation-filters="sRGB">
      <feFlood flood-color="#453539"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo -->
  <image x="95" y="95" width="440" height="440" xlink:href="logo.svg" href="logo.svg" filter="url(#cocoa)"/>

  <!-- Text -->
  <text x="610" y="285" font-family="Comfortaa" font-size="88" fill="#5A3E36">TinyWelt3D</text>
  <text x="614" y="355" font-family="Nunito" font-weight="600" font-size="42" fill="#9B5F5F">Mini worlds brought to life.</text>
  <text x="614" y="410" font-family="Nunito" font-weight="400" font-size="28" fill="#7A5A52">Handmade 3D-printed dioramas &amp; lamps</text>

  <text x="614" y="475" font-family="Nunito" font-weight="600" font-size="28" fill="#9d8189">tinywelt3d.github.io</text>
</svg>
