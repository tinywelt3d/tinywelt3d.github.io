    <style>
      :root {
        /* Background gradient colors */
        --rosa-top: #f4acb7;
        --rosa-mid: #ffe5d9;
        --beige-bottom: #F6F0E7;

        /* UI colors derived from gradient */
        --text-primary: #5A3E36;     /* warm brown */
        --text-secondary: #9B5F5F;   /* muted rose */
        --button-main: #9d8189;      /* dusty rose */
        --button-hover: #735960;     /* deeper rose */
        --button-text: #FFFFFF;
        --footer-text: #7A5A52;
        --logo-color: #453539;       /* cocoa */
      }

      body {
        margin: 0;
        padding: 32px 16px;
        box-sizing: border-box;
        font-family: 'Nunito', sans-serif;
        background: linear-gradient(
          180deg,
          var(--rosa-top) 0%,
          var(--rosa-mid) 45%,
          var(--beige-bottom) 100%
        );
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }

      .logo {
        width: 250px;
        height: 250px;
        background-color: var(--logo-color);
        -webkit-mask: url("logo.svg") no-repeat center / contain;
        mask: url("logo.svg") no-repeat center / contain;
      }

      h1 {
        font-family: 'Comfortaa', sans-serif;
        font-weight: 400;
        font-size: 2.6rem;
        margin: 0;
        color: var(--text-primary);
      }

      h2 {
        font-family: 'Nunito', sans-serif;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 28px;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 260px;
      }

      .link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45em;
        background-color: var(--button-main);
        color: var(--button-text);
        text-decoration: none;
        font-weight: 600;
        padding: 13px;
        border-radius: 30px;
        transition: all 0.3s ease;
        font-family: 'Montserrat', sans-serif;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      .link svg {
        height: 1.05em;
        width: auto;
        fill: currentColor;
        flex-shrink: 0;
      }

      .link:hover,
      .link:focus-visible {
        background-color: var(--button-hover);
        transform: translateY(-2px) scale(1.02);
      }

      .link:focus-visible {
        outline: 3px solid var(--text-primary);
        outline-offset: 3px;
      }

      footer {
        font-family: 'Nunito', sans-serif;
        font-weight: 300;
        font-size: 0.9rem;
        margin-top: 34px;
        color: var(--footer-text);
        opacity: 0.85;
      }

      footer a {
        color: var(--text-secondary);
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
